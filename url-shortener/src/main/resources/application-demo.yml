spring:
  datasource:
    url: jdbc:h2:mem:url_shortener;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    locations: classpath:db/migration/h2
  data:
    redis:
      timeout: 100ms

app:
  shortener:
    base-url: http://localhost:8080

management:
  health:
    redis:
      enabled: false
