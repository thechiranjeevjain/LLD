spring:
  application:
    name: url-shortener
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/url_shortener?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${MYSQL_USER:url_shortener}
    password: ${MYSQL_PASSWORD:url_shortener}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

app:
  shortener:
    base-url: ${SHORT_BASE_URL:http://localhost:8080}
    generated-code-length: ${SHORT_CODE_LENGTH:8}
    code-generation-attempts: 10
    cache-ttl: ${SHORT_CACHE_TTL:24h}
